$schema: "https://json-schema.org/draft/2020-12/schema"
title: AI Capability Manifest
type: object
required:
  - service
  - owners
  - models
  - tools
  - datasets
  - guardrails
  - observability
properties:
  service:
    type: string
  owners:
    type: array
    items:
      type: string
  models:
    type: array
    minItems: 1
    items:
      type: object
      required: [provider, name, purpose]
      properties:
        provider:
          type: string
        name:
          type: string
        purpose:
          type: string
  tools:
    type: array
    items:
      type: object
      required: [name, access]
      properties:
        name:
          type: string
        access:
          type: string
        notes:
          type: string
  datasets:
    type: array
    items:
      type: object
      required: [name, purpose]
      properties:
        name:
          type: string
        purpose:
          type: string
        location:
          type: string
  guardrails:
    type: object
    required: [policies]
    properties:
      policies:
        type: array
        items:
          type: string
      escalation:
        type: string
  observability:
    type: object
    required: [tracing, metrics, dashboards]
    properties:
      tracing:
        type: string
      metrics:
        type: string
      dashboards:
        type: string
