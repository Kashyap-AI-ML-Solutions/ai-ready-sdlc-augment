language: javascript-typescript
detect:
  extensions: [".js", ".jsx", ".ts", ".tsx"]
  files: ["package.json", "tsconfig.json"]
required_tools:
  - tool: eslint
    category: code_quality
    command: npx eslint .
  - tool: tsc
    category: code_quality
    command: npx tsc --noEmit
  - tool: npm-audit
    category: security
    command: npm audit --json
  - tool: cyclomatic-complexity
    category: complexity
    command: npx --no-install cyclomatic-complexity './**/*.{js,jsx,ts,tsx}' --threshold-warnings 10 --threshold-errors 20 --exclude '**/{node_modules,coverage,dist,build,.adlc,reports}/**' --json
  - tool: fta-cli
    category: maintainability
    command: npx --no-install fta --json --score-cap 75 .
optional_tools:
  - tool: prettier
    category: style
    command: npx prettier --check .
  - tool: semgrep
    category: security
    command: semgrep --config auto .
